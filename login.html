<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json">
  <title>Login | Meena Chitfunds</title>
  
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #000000;
      --text-muted: #606060;
      --btn-bg: #f2f2f2;
      --btn-hover: #e5e5e5;
      --brand-accent: #065fd4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f0f0f;
        --text-main: #ffffff;
        --text-muted: #aaaaaa;
        --btn-bg: #272727;
        --btn-hover: #3f3f3f;
        --brand-accent: #3ea6ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* No box, just a seamless content wrapper */
    .content-wrapper {
      width: 100%;
      max-width: 360px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin: 0;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--brand-accent);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 6px;
      margin-bottom: 48px;
    }

    .login-prompt {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Minimalist Google Button */
    .google-btn {
      background-color: var(--btn-bg);
      color: var(--text-main);
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .google-btn:hover {
      background-color: var(--btn-hover);
    }

    .google-btn:active {
      transform: scale(0.97);
    }

    .google-btn svg {
      width: 22px;
      height: 22px;
    }

    .secure-note {
      margin-top: 48px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .secure-note svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Loader */
    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="content-wrapper">
    
    <h1 class="brand-title">Meena Chitfunds</h1>
    <div class="brand-subtitle">By Goorac</div>

    <div class="login-prompt">
      Sign in to manage your workspace
    </div>
    
    <button id="google-login-btn" class="google-btn">
      <svg viewBox="0 0 48 48" id="google-icon">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
      </svg>
      <span id="btn-text">Continue with Google</span>
      <div id="loader" class="loader"></div>
    </button>

    <div class="secure-note">
      <svg viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
      End-to-end encrypted portal
    </div>

  </div>

  <script type="module">
    import { auth } from './config.js';
    import { 
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    const provider = new GoogleAuthProvider();
    const loginBtn = document.getElementById('google-login-btn');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');
    const googleIcon = document.getElementById('google-icon');

    // Redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace('home.html');
    });

    loginBtn.addEventListener('click', async () => {
      btnText.style.display = 'none';
      googleIcon.style.display = 'none';
      loader.style.display = 'block';
      loginBtn.disabled = true;

      try {
        await signInWithPopup(auth, provider);
        window.location.replace('home.html');
      } catch (error) {
        console.error(error);
        alert("Authentication failed.");
        btnText.style.display = 'block';
        googleIcon.style.display = 'block';
        loader.style.display = 'none';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
