<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json">
  <title>Ledger - Meena Chitfunds</title>
  
  <style>
    /* Premium Theme Variables */
    :root {
      --bg-color: #f4f7f6;
      --text-main: #111111;
      --text-muted: #6b7280;
      --surface-color: #ffffff;
      --surface-hover: #f9fafb;
      --border-color: #e5e7eb;
      --brand-accent: #065fd4;
      --brand-accent-light: #e6f0fa;
      --danger-color: #dc3545;
      --danger-light: #fde8e8;
      --warning-color: #f59e0b;
      --warning-light: #fef3c7;
      --success-color: #0f9d58;
      --success-light: #e6f4ea;
      --modal-overlay: rgba(0, 0, 0, 0.6);
      --card-shadow: 0 8px 24px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.03);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0a0a0a;
        --text-main: #f8f9fa;
        --text-muted: #9ca3af;
        --surface-color: #141414;
        --surface-hover: #1f1f1f;
        --border-color: #2d2d2d;
        --brand-accent: #3ea6ff;
        --brand-accent-light: rgba(62, 166, 255, 0.15);
        --danger-color: #ff4e45;
        --danger-light: rgba(255, 78, 69, 0.15);
        --warning-color: #fbbf24;
        --warning-light: rgba(251, 191, 36, 0.15);
        --success-color: #34a853;
        --success-light: rgba(52, 168, 83, 0.15);
        --modal-overlay: rgba(0, 0, 0, 0.85);
        --card-shadow: 0 8px 24px rgba(0,0,0,0.2);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Premium Header */
    header {
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @media (prefers-color-scheme: dark) { header { background-color: rgba(20, 20, 20, 0.85); } }

    .header-titles h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .header-back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.2s;
      margin-right: 12px;
    }
    .header-back-btn:active { background-color: var(--surface-hover); }
    .header-back-btn svg { width: 24px; height: 24px; fill: currentColor; }

    .header-titles {
      display: flex;
      align-items: center;
    }

    /* List Container & Transactions */
    .list-container { padding: 24px 20px 80px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; margin-bottom: 20px; color: var(--text-muted); }

    /* HIGH-END LEDGER CARDS */
    .txn-card {
      background-color: var(--surface-color); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 20px; margin-bottom: 20px;
      box-shadow: var(--card-shadow); transition: transform 0.2s;
      display: flex; flex-direction: column; gap: 16px;
    }
    .txn-card:active { transform: scale(0.98); background-color: var(--surface-hover); border-color: var(--brand-accent);}

    .txn-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .txn-profile { display: flex; gap: 14px; align-items: center; }
    .txn-avatar { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--brand-accent), #004ba0); color: white; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(6, 95, 212, 0.2);}
    .txn-user-info { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .txn-name { margin: 0; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-main); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .txn-user-id { font-size: 11px; font-family: monospace; background: var(--surface-hover); color: var(--text-muted); padding: 4px 8px; border-radius: 6px; font-weight: 700; border: 1px solid var(--border-color); }
    
    .txn-amount-box { text-align: right; flex-shrink: 0;}
    .txn-amount { font-size: 22px; font-weight: 800; color: var(--success-color); letter-spacing: -0.5px; }
    .txn-status-badge { display: inline-block; font-size: 10px; text-transform: uppercase; background: var(--success-light); color: var(--success-color); padding: 4px 8px; border-radius: 6px; font-weight: 800; margin-top: 4px; letter-spacing: 0.5px;}

    .txn-details-row { display: flex; gap: 12px; }
    .txn-detail-pill { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
    .detail-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 0.5px; }
    .detail-val { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .detail-val.mono { font-family: monospace; letter-spacing: 0.5px; color: var(--brand-accent); }

    .txn-footer { border-top: 1px dashed var(--border-color); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; }
    .txn-date-time { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px;}
    .txn-date-time svg { width: 14px; height: 14px; fill: currentColor; }
    .txn-type { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; background: var(--surface-hover); padding: 4px 8px; border-radius: 6px;}

    .load-more-btn { width: 100%; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: var(--card-shadow); }
    .load-more-btn:active { background: var(--surface-hover); transform: scale(0.98);}

    /* Loading Spinner */
    .loader { border: 3px solid var(--border-color); border-top: 3px solid var(--brand-accent); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* --- HIGH-END SKELETON LOADING UI (Matches New Cards Perfectly) --- */
    @keyframes shimmer {
      0% { background-position: -500px 0; }
      100% { background-position: 500px 0; }
    }
    
    .skeleton {
      background: linear-gradient(90deg, var(--surface-hover) 25%, var(--border-color) 50%, var(--surface-hover) 75%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite linear;
      border-radius: 4px;
    }
    
    .skeleton-txn-card {
      background-color: var(--surface-color); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 20px; margin-bottom: 20px;
      box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 16px;
    }
    .skel-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .skel-profile { display: flex; gap: 14px; align-items: center; }
    .skel-avatar { width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; }
    .skel-info { display: flex; flex-direction: column; gap: 8px; }
    .skel-name { width: 140px; height: 16px; border-radius: 4px; }
    .skel-id { width: 80px; height: 20px; border-radius: 6px; }
    
    .skel-amount-box { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .skel-amount { width: 80px; height: 22px; border-radius: 4px; }
    .skel-badge { width: 50px; height: 16px; border-radius: 6px; }

    .skel-details-row { display: flex; gap: 12px; }
    .skel-pill { flex: 1; height: 56px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; padding: 0 14px; gap: 8px;}
    .skel-pill-label { width: 50%; height: 10px; border-radius: 4px; }
    .skel-pill-val { width: 70%; height: 14px; border-radius: 4px; }

    .skel-footer { border-top: 1px dashed var(--border-color); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; }
    .skel-date { width: 120px; height: 12px; border-radius: 4px; }
    .skel-type { width: 60px; height: 16px; border-radius: 6px; }

    /* System Alert Modals */
    .center-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); z-index: 200; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);}
    .center-modal.active { opacity: 1; pointer-events: all; }
    .mini-modal-content {
      background-color: var(--surface-color); width: 90%; max-width: 340px;
      border-radius: 24px; padding: 30px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: scale(0.95); transition: 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 1px solid var(--border-color); text-align: center;
    }
    .center-modal.active .mini-modal-content { transform: scale(1); }
    .msg-icon { font-size: 48px; margin-bottom: 16px; }
    .mini-modal-title { font-size: 20px; font-weight: 800; margin: 0 0 12px 0; color: var(--text-main); }
    .mini-modal-text { font-size: 14px; color: var(--text-muted); margin: 0 0 28px 0; line-height: 1.5; font-weight: 500; word-break: break-word;}
    .mini-btn { padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 800; border: none; cursor: pointer; width: 100%; background-color: var(--brand-accent); color: #fff;}
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <button onclick="window.history.back()" class="header-back-btn">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1>Transaction Feed</h1>
    </div>
  </header>

  <main>
    <div class="list-container">
      <div class="section-title">Complete Ledger History</div>
      <div id="txn-list">
        <!-- Skeletons will be injected here via JS -->
      </div>
      <button id="load-more-btn" class="load-more-btn" style="display: none;">Load Older Records</button>
    </div>
  </main>

  <aside id="message-modal" class="center-modal">
    <div class="mini-modal-content">
      <div id="msg-icon" class="msg-icon">⚠️</div>
      <h3 class="mini-modal-title" id="msg-title">Error</h3>
      <p class="mini-modal-text" id="msg-body">Something went wrong.</p>
      <div class="mini-modal-actions">
        <button class="mini-btn" onclick="closeMessageModal()">Understood</button>
      </div>
    </div>
  </aside>

  <script type="module">
    import { auth, db } from './config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { collection, query, orderBy, limit, getDocs, startAfter } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    onAuthStateChanged(auth, (user) => { if (!user) window.location.replace('login.html'); });

    // --- Global Haptics Engine ---
    document.addEventListener('click', (e) => {
        const interactiveEle = e.target.closest('button, .txn-card, .header-back-btn');
        if (interactiveEle && "vibrate" in navigator) {
            navigator.vibrate(40); 
        }
    });

    window.showMessage = function(title, body) {
      document.getElementById('msg-title').innerText = title;
      document.getElementById('msg-body').innerHTML = body; 
      document.getElementById('message-modal').classList.add('active');
    };
    window.closeMessageModal = function() {
      document.getElementById('message-modal').classList.remove('active');
    };

    // --- Fetch Transaction History & Pagination ---
    const txnList = document.getElementById('txn-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    let lastVisibleTxn = null;

    async function loadTransactions(isLoadMore = false) {
      try {
        let q;
        if (isLoadMore && lastVisibleTxn) {
          q = query(collection(db, "transactions"), orderBy("date", "desc"), startAfter(lastVisibleTxn), limit(10));
        } else {
          // INJECT PREMIUM SKELETON ANIMATIONS FOR LARGE CARDS
          let skelHtml = '';
          for(let i=0; i<4; i++) {
              skelHtml += `
              <div class="skeleton-txn-card">
                  <div class="skel-header">
                      <div class="skel-profile">
                          <div class="skel-avatar skeleton"></div>
                          <div class="skel-info">
                              <div class="skel-name skeleton"></div>
                              <div class="skel-id skeleton"></div>
                          </div>
                      </div>
                      <div class="skel-amount-box">
                          <div class="skel-amount skeleton"></div>
                          <div class="skel-badge skeleton"></div>
                      </div>
                  </div>
                  <div class="skel-details-row">
                      <div class="skel-pill">
                          <div class="skel-pill-label skeleton"></div>
                          <div class="skel-pill-val skeleton"></div>
                      </div>
                      <div class="skel-pill">
                          <div class="skel-pill-label skeleton"></div>
                          <div class="skel-pill-val skeleton"></div>
                      </div>
                  </div>
                  <div class="skel-footer">
                      <div class="skel-date skeleton"></div>
                      <div class="skel-type skeleton"></div>
                  </div>
              </div>`;
          }
          txnList.innerHTML = skelHtml; 
          
          loadMoreBtn.style.display = 'none';

          q = query(collection(db, "transactions"), orderBy("date", "desc"), limit(10));
        }

        // SYNTHETIC DELAY FOR LUXURY UX (Ensures shimmer displays cleanly)
        await new Promise(r => setTimeout(r, 450));

        let querySnapshot;
        try {
          querySnapshot = await getDocs(q);
        } catch (err) {
          console.warn("Index missing for date sort. Falling back to basic fetch.");
          const fallbackQ = (isLoadMore && lastVisibleTxn) 
            ? query(collection(db, "transactions"), startAfter(lastVisibleTxn), limit(10)) 
            : query(collection(db, "transactions"), limit(10));
          querySnapshot = await getDocs(fallbackQ);
        }

        if (querySnapshot.empty) {
          if(!isLoadMore) txnList.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 40px 20px; font-weight: 600;">No transaction records found.</div>';
          loadMoreBtn.style.display = 'none';
          return;
        }

        if (!isLoadMore) txnList.innerHTML = '';
        lastVisibleTxn = querySnapshot.docs[querySnapshot.docs.length - 1];

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          let displayDate = "Processing...";
          if(data.date && typeof data.date.toDate === 'function') {
              const d = data.date.toDate();
              displayDate = d.toLocaleDateString('en-IN', { 
                  day: 'numeric', month: 'short', year: 'numeric', 
                  hour: '2-digit', minute:'2-digit', hour12: true 
              });
          }

          const displayName = data.subscriberName || "Participant";
          const userInitial = displayName.charAt(0).toUpperCase();
          const txnType = data.type || "Monthly Installment";

          const card = document.createElement('div');
          card.className = 'txn-card';
          card.innerHTML = `
            <div class="txn-header">
                <div class="txn-profile">
                    <div class="txn-avatar">${userInitial}</div>
                    <div class="txn-user-info">
                        <h3 class="txn-name">${displayName}</h3>
                        <span class="txn-user-id">@${data.subscriberId || 'UNKNOWN'}</span>
                    </div>
                </div>
                <div class="txn-amount-box">
                    <div class="txn-amount">₹${Number(data.amount).toLocaleString('en-IN')}</div>
                    <div class="txn-status-badge">Approved</div>
                </div>
            </div>
            
            <div class="txn-details-row">
                <div class="txn-detail-pill">
                    <span class="detail-label">Active Group</span>
                    <span class="detail-val mono">@${data.groupId || 'N/A'}</span>
                </div>
                <div class="txn-detail-pill">
                    <span class="detail-label">Ledger Assignment</span>
                    <span class="detail-val">Month ${data.monthAttributed || '--'}</span>
                </div>
            </div>

            <div class="txn-footer">
                <div class="txn-date-time">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    ${displayDate}
                </div>
                <div class="txn-type">${txnType}</div>
            </div>
          `;
          txnList.appendChild(card);
        });

        loadMoreBtn.style.display = querySnapshot.docs.length === 10 ? 'block' : 'none';
      } catch (error) { 
        console.error(error); 
        
        if(error.message && error.message.includes("https://console.firebase.google.com")) {
             const urlRegex = /(https:\/\/console\.firebase\.google\.com[^\s]+)/g;
             const match = error.message.match(urlRegex);
             if(match && match.length > 0 && !isLoadMore) {
                  txnList.innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="var(--warning-color)" style="margin-bottom:12px;"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                        <h3 style="margin:0 0 8px 0; font-size:16px; color:var(--text-main);">Ledger Index Required</h3>
                        <a href="${match}" target="_blank" style="display:inline-block; background:var(--brand-accent); color:white; padding:10px 16px; border-radius:8px; text-decoration:none; font-weight:800; font-size:13px; margin-top:8px;">Build Feed Index</a>
                    </div>`;
                  loadMoreBtn.style.display = 'none';
                  return;
             }
        }
        
        if(!isLoadMore) txnList.innerHTML = `<div style="color:var(--danger-color); text-align:center; padding:20px; font-weight: 800;">Error loading ledger feed.</div>`;
      }
    }
    
    document.getElementById('load-more-btn').addEventListener('click', () => loadTransactions(true));

    // Initialize Page
    loadTransactions(false);
  </script>
</body>
</html>
